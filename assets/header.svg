<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Krish Shah</title>
  <desc id="d">AI/ML Engineer and Software Engineer. Agentic AI, RAG, computer vision, full-stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#0c1f45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:700 76px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1.5px}
    .role{font:600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:url(#accent);letter-spacing:.3px}
    .tag{font:500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#93c5fd;opacity:0;animation:cycle 12s infinite}
    .t1{opacity:1;animation:first 12s infinite}.t2{animation-delay:4s}.t3{animation-delay:8s}
    .prompt{font:500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22d3ee}
    .edge{stroke:#3b82f6;stroke-opacity:.35;stroke-width:1.4;fill:none}
    .flow{stroke:url(#accent);stroke-width:2;fill:none;stroke-dasharray:6 14;animation:dash 3.2s linear infinite}
    .node{fill:#0b1730;stroke:#38bdf8;stroke-width:2}
    .core{fill:#22d3ee;animation:pulse 3.2s ease-in-out infinite}
    .c2{animation-delay:.8s}.c3{animation-delay:1.6s}.c4{animation-delay:2.4s}
    .driftA{animation:driftA 16s ease-in-out infinite alternate}
    .driftB{animation:driftB 20s ease-in-out infinite alternate}
    .bar{animation:slide 6s ease-in-out infinite}
    @keyframes cycle{0%,3%{opacity:0}7%,30%{opacity:1}34%,100%{opacity:0}}
    @keyframes first{0%,28%{opacity:1}33%,96%{opacity:0}100%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-80}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes driftA{from{transform:translate(0,0)}to{transform:translate(50px,24px)}}
    @keyframes driftB{from{transform:translate(0,0)}to{transform:translate(-60px,-18px)}}
    @keyframes slide{0%{transform:translateX(-420px)}100%{transform:translateX(1200px)}}
    @media (prefers-reduced-motion:reduce){
      .tag,.flow,.core,.driftA,.driftB,.bar{animation:none}
      .tag{opacity:0}.t1{opacity:1}.core{opacity:1}
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="driftA" cx="930" cy="80" r="260" fill="url(#glowA)"/>
    <circle class="driftB" cx="1120" cy="300" r="220" fill="url(#glowB)"/>

    <!-- pipeline motif: data -> retrieve -> agents -> output -->
    <g transform="translate(790 70)">
      <path class="edge" d="M30 100 L130 40 M30 100 L130 160 M130 40 L240 100 M130 160 L240 100 M130 40 L130 160 M240 100 L340 60 M240 100 L340 150"/>
      <path class="flow" d="M30 100 L130 40 L240 100 L340 60"/>
      <path class="flow" d="M30 100 L130 160 L240 100 L340 150" style="animation-delay:1.1s"/>
      <g>
        <circle class="node" cx="30" cy="100" r="15"/><circle class="core" cx="30" cy="100" r="5"/>
        <circle class="node" cx="130" cy="40" r="13"/><circle class="core c2" cx="130" cy="40" r="4.5"/>
        <circle class="node" cx="130" cy="160" r="13"/><circle class="core c3" cx="130" cy="160" r="4.5"/>
        <circle class="node" cx="240" cy="100" r="19" style="stroke:#8b5cf6"/><circle class="core c2" cx="240" cy="100" r="7" style="fill:#a78bfa"/>
        <circle class="node" cx="340" cy="60" r="12"/><circle class="core c4" cx="340" cy="60" r="4"/>
        <circle class="node" cx="340" cy="150" r="12"/><circle class="core c3" cx="340" cy="150" r="4"/>
      </g>
    </g>

    <text class="name" x="72" y="148">Krish Shah</text>
    <rect x="74" y="172" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text class="role" x="72" y="218">AI/ML Engineer  |  Software Engineer</text>

    <text class="prompt" x="72" y="274">&gt;</text>
    <text class="tag t1" x="94" y="274">agentic AI and retrieval systems that cite their sources</text>
    <text class="tag t2" x="94" y="274">computer vision for terrain and landing-zone analysis</text>
    <text class="tag t3" x="94" y="274">full-stack apps shipped with real teams and real users</text>

    <rect class="bar" x="0" y="336" width="420" height="4" fill="url(#sweep)"/>
  </g>
</svg>
